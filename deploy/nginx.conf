# FlockWatch — nginx reverse proxy (ports 80 + 443 → 127.0.0.1:8000)
#
# Install: deploy/install.sh renders this file with your domain substituted and
# links it into sites-enabled. Placeholder tokens: __DOMAIN__, __CERT__, __CERT_KEY__.
#
# The Deno app listens on 127.0.0.1:8000 (see main.ts / the systemd unit).

upstream flockwatch_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# WebSocket connections must forward both hop-by-hop upgrade headers. Using a
# map keeps ordinary HTTP requests eligible for upstream keepalive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Port 80: redirect to HTTPS ───────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # ACME challenge path for Let's Encrypt (served before redirecting).
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Port 443: reverse proxy ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     __CERT__;
    ssl_certificate_key __CERT_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers (FlockWatch serves no inline scripts/styles by design).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Static assets are served directly by the app; proxy everything through.
    location / {
        proxy_pass http://flockwatch_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Regional sockets send a heartbeat every 25 seconds. These timeouts
        # tolerate temporary stalls without forcing clients into reconnect loops.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    access_log /var/log/nginx/flockwatch.access.log;
    error_log  /var/log/nginx/flockwatch.error.log;
}
